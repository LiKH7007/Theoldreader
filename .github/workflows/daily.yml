name: Daily The Old Reader Radar

on:
  schedule:
    # 08:00 Beijing time every day. GitHub Actions cron uses UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch, summarize, and email
        env:
          TOR_TOKEN: ${{ secrets.TOR_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ vars.SMTP_SSL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TOR_SOURCE_MODE: ${{ vars.TOR_SOURCE_MODE }}
          TOR_LOOKBACK_HOURS: ${{ vars.TOR_LOOKBACK_HOURS }}
          TOR_ONLY_UNREAD: ${{ vars.TOR_ONLY_UNREAD }}
          TOR_API_PAGE_SIZE: ${{ vars.TOR_API_PAGE_SIZE }}
          TOR_MAX_PAGES_PER_FEED: ${{ vars.TOR_MAX_PAGES_PER_FEED }}
          TOR_MAX_ITEMS: ${{ vars.TOR_MAX_ITEMS }}
          TOR_MIN_SUMMARY_CHARS: ${{ vars.TOR_MIN_SUMMARY_CHARS }}
          TOR_FETCH_ARTICLE_PAGE: ${{ vars.TOR_FETCH_ARTICLE_PAGE }}
          TOR_INCLUDE_READER_PICKS: ${{ vars.TOR_INCLUDE_READER_PICKS }}
          TOR_INCLUDE_NON_RESEARCH: ${{ vars.TOR_INCLUDE_NON_RESEARCH }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_THINKING: ${{ vars.DEEPSEEK_THINKING }}
          DEEPSEEK_REASONING_EFFORT: ${{ vars.DEEPSEEK_REASONING_EFFORT }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_REGION: ${{ vars.TENCENT_REGION }}
          TENCENT_TARGET: ${{ vars.TENCENT_TARGET }}
          DIGEST_PROVIDER: ${{ vars.DIGEST_PROVIDER }}
        run: python scripts/daily_theoldreader.py
