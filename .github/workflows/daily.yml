name: Daily The Old Reader Radar

on:
  schedule:
    # 07:00 Beijing time every day. GitHub Actions cron uses UTC.
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  send-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch, summarize, and email
        env:
          TOR_TOKEN: ${{ secrets.TOR_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ vars.SMTP_SSL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TOR_LIMIT: ${{ vars.TOR_LIMIT }}
          TOR_MAX_ITEMS: ${{ vars.TOR_MAX_ITEMS }}
        run: python scripts/daily_theoldreader.py
