name: Schedule Smoke Test

on:
  schedule:
    # Diagnostic only: verify whether GitHub schedule events fire in this repository.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Print schedule diagnostics
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "utc_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "local_time=$(date '+%Y-%m-%d %H:%M:%S %Z')"
